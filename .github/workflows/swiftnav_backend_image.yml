name: SwiftNav backend image

on:
  push:
    branches: ['swiftnav/*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME#swiftnav/}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile_backend
          platforms: linux/amd64
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/digger_backend:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/digger_backend:${{ github.sha }}
